<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a237e, #3949ab);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .box {
      padding: 60px 40px;
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    p {
      font-size: 20px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">👋</div>
    <h1>Hello and Welcome!</h1>
    <p>We are glad you are here.</p>
  </div>
</body>
</html>
